<header class="site-header" id="home">
  <app-nav-header [props]="companyInfo"></app-nav-header>
  <app-hero></app-hero>
</header>

<main id="main-content">
  <app-about></app-about>
  <app-services></app-services>
  <app-destinations></app-destinations>
  <app-packages></app-packages>

  @defer (on viewport) {
    <app-reviews></app-reviews>
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }

  @defer (on viewport) {
    <app-gallery></app-gallery>
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }

  @defer (on viewport) {
    <app-faq></app-faq>
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }

  @defer (on viewport) {
    <app-blog></app-blog>
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }

  @defer (on viewport) {
    <app-contact></app-contact>
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }
</main>

<app-site-footer></app-site-footer>
