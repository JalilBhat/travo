<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header" id="home">
  <app-nav-header [props]="companyInfo"></app-nav-header>
  <app-hero></app-hero>
</header>

<main id="main-content">
  <app-about></app-about>
  <app-services></app-services>
  <app-destinations></app-destinations>
  <app-packages></app-packages>

  <div id="reviews">
    @defer (on viewport) {
    <app-reviews></app-reviews>
    } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
    }
  </div>

  <div id="gallery">
    @defer (on viewport) {
    <app-gallery></app-gallery>
    } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
    }
  </div>

  <div id="faq">
    @defer (on viewport) {
    <app-faq></app-faq>
    } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
    }
  </div>

  <div id="blogs">
    @defer (on viewport) {
    <app-blog></app-blog>
    } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
    }
  </div>

  <div id="contact">
    @defer (on viewport) {
    <app-contact></app-contact>
    } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
    }
  </div>

</main>

<app-site-footer></app-site-footer>
<app-float-whatsapp></app-float-whatsapp>
