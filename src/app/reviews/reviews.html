<section class="section section--light" id="reviews">
  <div class="wrap">
    <div class="section-head section-head--center">
      <p class="kicker">Reviews</p>
      <h2>What Our Travelers Say</h2>
    </div>
    <div class="reviews-grid">
      @for (review of testimonials; track review.name) {
      <article class="review-card">
        <p class="stars">★★★★★</p>
        <p class="quote">"{{ review.text }}"</p>
        <p class="author">{{ review.name }}</p>
        <p class="trip">{{ review.trip }}</p>
      </article>
      }
    </div>
  </div>
</section>
